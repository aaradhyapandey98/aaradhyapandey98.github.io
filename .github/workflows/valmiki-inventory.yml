name: Valmiki source inventory
on:
  push:
    paths: ['.github/workflows/valmiki-inventory.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Inventory source URLs and reconcile chapter indexes
        run: |
          cd valmiki-ramayana-archive/source
          python3 inventory.py --output ../audit/original --max-pages 1500 --max-seconds 600 --delay 0.1
      - name: Commit audit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add valmiki-ramayana-archive/audit/original
          git diff --cached --quiet || (git commit -m "Record Valmiki source inventory checkpoint" && git push)
